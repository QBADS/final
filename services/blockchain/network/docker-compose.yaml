version: "3.7"

networks:
  qbads:
    name: qbads

services:
  # --- Ordering service (RAFT, 3 nodes) ---
  orderer1.qbads.com:
    image: hyperledger/fabric-orderer:2.5
    environment: &orderer-env
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    working_dir: /root
    command: orderer
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/genesis.block
      - ./crypto-config/ordererOrganizations/qbads.com/orderers/orderer1.qbads.com/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/qbads.com/orderers/orderer1.qbads.com/tls:/var/hyperledger/orderer/tls
    ports:
      - "7050:7050"
      - "7053:7053"
    networks: [qbads]

  orderer2.qbads.com:
    image: hyperledger/fabric-orderer:2.5
    environment: *orderer-env
    working_dir: /root
    command: orderer
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/genesis.block
      - ./crypto-config/ordererOrganizations/qbads.com/orderers/orderer2.qbads.com/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/qbads.com/orderers/orderer2.qbads.com/tls:/var/hyperledger/orderer/tls
    ports:
      - "8050:7050"
      - "8053:7053"
    networks: [qbads]

  orderer3.qbads.com:
    image: hyperledger/fabric-orderer:2.5
    environment: *orderer-env
    working_dir: /root
    command: orderer
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/genesis.block
      - ./crypto-config/ordererOrganizations/qbads.com/orderers/orderer3.qbads.com/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/qbads.com/orderers/orderer3.qbads.com/tls:/var/hyperledger/orderer/tls
    ports:
      - "9050:7050"
      - "9053:7053"
    networks: [qbads]

  # --- CouchDB state databases, one per peer ---
  couchdb.banka:
    image: hyperledger/fabric-couchdb:latest
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["5984:5984"]
    networks: [qbads]

  couchdb.bankb:
    image: hyperledger/fabric-couchdb:latest
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["6984:5984"]
    networks: [qbads]

  couchdb.institutionc:
    image: hyperledger/fabric-couchdb:latest
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["7984:5984"]
    networks: [qbads]

  couchdb.regulatord:
    image: hyperledger/fabric-couchdb:latest
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["8984:5984"]
    networks: [qbads]

  # --- Organization peers ---
  peer0.banka.qbads.com:
    image: hyperledger/fabric-peer:2.5
    environment: &peer-env-common
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=qbads
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.banka:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_PEER_ID=peer0.banka.qbads.com
      - CORE_PEER_ADDRESS=peer0.banka.qbads.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.banka.qbads.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.banka.qbads.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.banka.qbads.com:7051
      - CORE_PEER_LOCALMSPID=BankAMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/banka.qbads.com/peers/peer0.banka.qbads.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/banka.qbads.com/peers/peer0.banka.qbads.com/tls:/etc/hyperledger/fabric/tls
      - peer0.banka:/var/hyperledger/production
    ports: ["7051:7051"]
    depends_on: [couchdb.banka]
    networks: [qbads]

  peer0.bankb.qbads.com:
    image: hyperledger/fabric-peer:2.5
    environment:
      <<: *peer-env-common
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.bankb:5984
      CORE_PEER_ID: peer0.bankb.qbads.com
      CORE_PEER_ADDRESS: peer0.bankb.qbads.com:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.bankb.qbads.com:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.bankb.qbads.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.bankb.qbads.com:7051
      CORE_PEER_LOCALMSPID: BankBMSP
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/bankb.qbads.com/peers/peer0.bankb.qbads.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/bankb.qbads.com/peers/peer0.bankb.qbads.com/tls:/etc/hyperledger/fabric/tls
      - peer0.bankb:/var/hyperledger/production
    ports: ["8051:7051"]
    depends_on: [couchdb.bankb]
    networks: [qbads]

  peer0.institutionc.qbads.com:
    image: hyperledger/fabric-peer:2.5
    environment:
      <<: *peer-env-common
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.institutionc:5984
      CORE_PEER_ID: peer0.institutionc.qbads.com
      CORE_PEER_ADDRESS: peer0.institutionc.qbads.com:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.institutionc.qbads.com:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.institutionc.qbads.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.institutionc.qbads.com:7051
      CORE_PEER_LOCALMSPID: InstitutionCMSP
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/institutionc.qbads.com/peers/peer0.institutionc.qbads.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/institutionc.qbads.com/peers/peer0.institutionc.qbads.com/tls:/etc/hyperledger/fabric/tls
      - peer0.institutionc:/var/hyperledger/production
    ports: ["9051:7051"]
    depends_on: [couchdb.institutionc]
    networks: [qbads]

  peer0.regulatord.qbads.com:
    image: hyperledger/fabric-peer:2.5
    environment:
      <<: *peer-env-common
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.regulatord:5984
      CORE_PEER_ID: peer0.regulatord.qbads.com
      CORE_PEER_ADDRESS: peer0.regulatord.qbads.com:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.regulatord.qbads.com:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.regulatord.qbads.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.regulatord.qbads.com:7051
      CORE_PEER_LOCALMSPID: RegulatorDMSP
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/regulatord.qbads.com/peers/peer0.regulatord.qbads.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/regulatord.qbads.com/peers/peer0.regulatord.qbads.com/tls:/etc/hyperledger/fabric/tls
      - peer0.regulatord:/var/hyperledger/production
    ports: ["10051:7051"]
    depends_on: [couchdb.regulatord]
    networks: [qbads]

  # --- CLI, for channel creation / chaincode lifecycle ---
  cli:
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_LOCALMSPID=BankAMSP
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_ADDRESS=peer0.banka.qbads.com:7051
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto-config
      - ./channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../chaincode:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode
      - ./crypto-config/peerOrganizations/banka.qbads.com/peers/peer0.banka.qbads.com/tls:/etc/hyperledger/fabric/tls
      - ./crypto-config/peerOrganizations/banka.qbads.com/users/Admin@banka.qbads.com/msp:/etc/hyperledger/fabric/msp
    networks: [qbads]

volumes:
  peer0.banka:
  peer0.bankb:
  peer0.institutionc:
  peer0.regulatord:
